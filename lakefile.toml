name = "RequestProject"
# This is the only Lake project of the repository (the former
# `export/lakefile.toml` and `export/lean-toolchain` were merged into this file
# and the root `lean-toolchain`).  Build with `lake build` from the root.
#
#   CCLib       : the Clight semantics, interpreter, memory model and
#                 separation logic, and the rest of the port (see
#                 export/LEAN.md)
#   Clightdefs  : the module every `clightgen -lean` output imports
#   Examples    : export/examples/ — generated test programs (Gen*), the
#                 proofs about them (*Sep, IsSorted*), and the non-vacuity /
#                 axiom checks (*Check).  Regression tests for the library and
#                 templates for new proofs; nothing outside examples/ depends
#                 on them.
#
# export/DiffRun.lean is not a library: test/lean/diff_exec.sh compiles it
# directly against each generated program.
#
# The Lean port lives in `export/` and its modules are named `CCLib.*`,
# `Clightdefs`, and (for the examples) bare names such as `GenSwap`.  The
# libraries below therefore use `export/` (resp. `export/examples/`) as their
# source directory, so `import CCLib.X` resolves when building from the
# repository root.
# Toolchain: leanprover/lean4:v4.32.1 (root `lean-toolchain`).  Mathlib is
# required (pinned to a revision built for v4.32.1) only by the bridge
# theorems of `CCLibMathlib` (`CCLib/lib/MathlibEquiv.lean`).  The rest of the
# port imports Lean core only.
defaultTargets = ["CCLib", "Clightdefs", "Examples", "CCTest", "VST", "main"]
# `lake test` runs the test suite of the reference interpreter (the
# executable `interpspec` below).
testDriver = "interpspec"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"

# `CCLibMathlib` (the modules that import Mathlib) is a second root, kept
# separate so that `import CCLib` stays Mathlib-free.  (It replaces the former
# `CCLibReal` root: the real-number Flocq files were removed, the port uses the
# exact IEEE-754 model `CCLib/lib/FloatModel.lean` instead; see
# MODULE_AUDIT.md.)
[[lean_lib]]
name = "CCLib"
srcDir = "export"
roots = ["CCLib", "CCLibMathlib"]

[[lean_lib]]
name = "Clightdefs"
srcDir = "export"

[[lean_lib]]
name = "Examples"
srcDir = "export/examples"
# Not built, because they import modules missing from this checkout (see
# MISSING_MODULES.md): ExtractionCheck, PrintCheck, RegallocCheck, RiscVAsmCheck.
# Not built, because their source files are missing from this checkout:
# ZbitsCheck, ArmPpcCheck, PowerPCLinkerParams, FloatsParsedCheck, X86AsmCheck, AArch64AsmCheck, CFrontendCheck.
roots = ["ArmPpcPtr64Gap", "Hspec", "ElabCheck", "ParseCheck", "DebugInfoCheck", "DriverAuxCheck", "Demo", "GenMain", "GenSwap", "GenStruct", "GenStructCopy", "GenLocalVar", "GenFuncPtr", "GenGotoLeave", "GenGotoBack", "GenU16Loop", "GenOOB", "IsSortedReal", "IsSortedSep", "SwapSep", "StructSep", "StructCopySep", "LocalVarSep", "FuncPtrSep", "GotoSep", "GotoBackSep", "U16LoopSep", "OOBSep", "MemCheck", "SepCheck", "DetermCheck", "TempsCheck", "FloatConvCheck", "LoadvWrapCheck", "MemInjCheck", "BigstepCheck", "LinkingCheck", "ValuesCheck", "MemdataCheck", "CsemCheck", "InitializersCheck", "CexecCheck", "SimplExprCheck", "SimplLocalsCheck", "CshmgenCheck", "RTLgenCheck", "BackendCheck", "AsmgenCheck", "OptimCheck", "X86Check", "RiscVCheck", "FSetAVLCheck", "AsmTestPrograms", "CParserCheck", "CPragmasCheck", "ParserCheck", "PrintOpCheck"]

# Generated test programs (`test/lean/*.lean`); they import `Clightdefs`,
# which the library above provides.  Their module names are `lean.<file>`
# (source directory `test/`), not `test.lean.<file>`: ProofWidgets, a Mathlib
# dependency, declares a library `test` owning every `test.*` module, so
# modules under `test.` would be looked up in ProofWidgets.
[[lean_lib]]
name = "CCTest"
srcDir = "test"
globs = ["lean.+"]

# The sequential test programs of VST (`vst/progs/*.c`) as Clight ASTs,
# generated by the Lean `clightgen` (`export/tools/gen_vst_progs.sh`), and the
# Lean port of VST's tests on them (`export/VST/`).
[[lean_lib]]
name = "VST"
srcDir = "export"
globs = ["VST.+"]

[[lean_lib]]
name = "main"
globs = ["main"]

# The executable `asmgen` below is disabled: its root
# (`export/examples/AsmEmit.lean`) is missing from this checkout.  Uncomment
# it once the file is restored.
#
# Writes the assembly files (x86-64, AArch64 or RISC-V) of the programs of
# `export/examples/AsmTestPrograms.lean` (used by `test/x86asm/run.sh`).
# [[lean_exe]]
# name = "asmgen"
# srcDir = "export/examples"
# root = "AsmEmit"

# The C compiler driver `ccomp` (port of `driver/Driver.ml`) for the AArch64
# target, built from the ported front end, the verified compiler,
# `Asmexpand` and the assembly printer.
[[lean_exe]]
name = "ccomp"
srcDir = "export/examples"
root = "CComp"

# `clightgen` (port of `export/ExportDriver.ml`): writes the Clight AST of a
# C file as a Lean module importing `Clightdefs` (AArch64 configuration).
[[lean_exe]]
name = "clightgen"
srcDir = "export/examples"
root = "Clightgen"

# Tests of the Lean `clightgen` and of the VST test programs
# (`export/examples/VSTSpec.lean`): `lake exe vstspec`.
[[lean_exe]]
name = "vstspec"
srcDir = "export/examples"
root = "VSTSpec"

# The test suite of the reference interpreter (`ccomp -interp`): an `IO` test
# suite in the style of `hspec` (`export/examples/Hspec.lean`), run by `main`.
# `lake test` (or `lake exe interpspec`) runs it; `-m PATTERN` selects the
# examples whose path contains `PATTERN`, `--skip PATTERN` skips them.
[[lean_exe]]
name = "interpspec"
srcDir = "export/examples"
root = "InterpSpec"
